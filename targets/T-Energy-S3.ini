; LilyGo T-Energy S3 (ESP32-S3-WROOM-1-N16R8, 16MB flash)
; Battery divider is hardwired to GPIO3 (BATTERY_ADC_DATA = IO3), buzzer moved to GPIO4.
; No memory_type override: the firmware does not use PSRAM, and forcing qio_opi can
; prevent boot on modules without octal PSRAM.
[env:T-Energy-S3]
extends = env:ESP32S3
board_build.flash_size = 16MB
build_flags =
    ${env:ESP32S3.build_flags}
    -DLILYGO_T_ENERGY_S3=1
